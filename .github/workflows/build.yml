name: Build

on:
  push:
    paths:
      - '.github/workflows/build.yml'
      - '*.slnx'
      - 'src/**'

  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - '*.slnx'
      - 'src/**'

jobs:
  versioner:
    name: Versioner
    runs-on: ubuntu-latest

    outputs:
      is_prerelease: ${{ steps.semver.outputs.is_prerelease }}
      app_version: ${{ steps.semver_norm.outputs.app_version }}
      app_version_info: ${{ steps.semver_norm.outputs.app_version_info }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get Semver
        id: semver
        uses: ./.github/actions/versioner

      - name: Normalize Version
        id: semver_norm
        run: |
          VERSION="${{ steps.semver.outputs.version }}"
          APP_VERSION="${VERSION#v}"
          APP_VERSION_INFO="${APP_VERSION}+${{ steps.semver.outputs.metadata }}"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "app_version_info=${APP_VERSION_INFO}" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: .NET Build & Test
    needs: [versioner]
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          dotnet-quality: 'ga'
          cache: true
          cache-dependency-path: |
            src/**/*.csproj
            **/packages.lock.json

      - name: Restore
        run: |
          dotnet restore
          mkdir -p ~/.nuget/packages

      - name: Build
        env:
          version: ${{ needs.versioner.outputs.app_version }}
          version_info: ${{ needs.versioner.outputs.app_version_info }}
        run: |
          dotnet build \
            --no-restore \
            --configuration Release \
            -p:Version="${version}" \
            -p:InformationalVersion="${version}+${version_info}" \
            -p:UseAppHost=false

      - name: Test
        run: |
          dotnet test \
            --no-build \
            --configuration Release

  docker:
    name: Build Docker Image
    needs: [versioner]
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write

    env:
      IMAGE_NAME: ghcr.io/alireza-rezaee/chapar-api

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: src/Chapar.API
          push: false
          build-args: |
            APP_VERSION=${{ needs.versioner.outputs.app_version }}
            APP_INFO_VERSION=${{ needs.versioner.outputs.app_version_info }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.versioner.outputs.app_version }}
