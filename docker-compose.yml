services:
  api:
    build:
      context: src/AlirezaRezaee.Chapar.API
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

      # Connection String
      - ConnectionStrings__Database=Server=mssql,1433;Database=${MSSQL_DATABASE};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:${REDIS_PORT},allowAdmin=${REDIS_ALLOW_ADMIN},connectTimeout=${REDIS_CONNECT_TIMEOUT},abortConnect=false
      
      # OTP Config
      - OTP__HashingKey=${OTP_HASHING_KEY}
      - OTP__MaxAttempts=${OTP_MaxAttempts}

      # RabbitMQ Config
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__VirtualHost=/
      - RabbitMQ__Username=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASS}

    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

    networks:
      - chapar

  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:?Set ACCEPT_EULA}
      MSSQL_PID: ${MSSQL_PID:?Set MSSQL_PID}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - mssql_data:/var/lib/mssql
    networks:
      - chapar

  redis:
    image: redis:8.10-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - chapar

  rabbitmq:
    image: rabbitmq:4.4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?Set RABBITMQ_PASS}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - chapar

volumes:
  mssql_data:
  redis_data:
  rabbitmq_data:

networks:
  chapar:
    driver: bridge
